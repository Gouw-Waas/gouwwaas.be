name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: '8.5'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Write production .env
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
        run: php .github/scripts/production-env.php "$RUNNER_TEMP/.env.production"

      - name: Deploy
        uses: deployphp/action@v1
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PHP_BIN: ${{ secrets.DEPLOY_PHP_BIN }}
          DEPLOY_DOTENV_FILE: ${{ runner.temp }}/.env.production
        with:
          dep: deploy production
          deployer-version: '8.0.5'
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      # /up checks that the app starts and reaches the database; / that pages render.
      - name: Health check
        id: health
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          for path in /up /; do
            ok=
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${APP_URL%/}$path" || true)
              echo "$path, attempt $attempt: HTTP $code"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "::error::${APP_URL%/}$path did not answer 200 after the deploy; rolling back."
              exit 1
            fi
          done

      # Only the code goes back: migrations that already ran stay (keep them backward compatible).
      - name: Roll back to the previous release
        if: failure() && steps.health.outcome == 'failure'
        uses: deployphp/action@v1
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PHP_BIN: ${{ secrets.DEPLOY_PHP_BIN }}
        with:
          dep: rollback production
          deployer-version: '8.0.5'
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Health after rollback
        if: failure() && steps.health.outcome == 'failure'
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${APP_URL%/}/up" || true)
          echo "After the rollback, /up answers HTTP $code"

      - name: Remove production .env
        if: always()
        run: rm -f "$RUNNER_TEMP/.env.production"
