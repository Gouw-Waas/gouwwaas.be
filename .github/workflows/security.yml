name: Security scan

# Scans every change on main (and pull requests) for known vulnerabilities,
# insecure code and leaked secrets, and builds an SBOM.
# Weekly as well: new vulnerabilities get published for code that didn't change.
#
# Results also appear under the repository's Security → Code scanning tab.
# Separate from the deploy workflow, so a newly published advisory never
# blocks an urgent deploy; a red run here means "update something".
#
# Fails on medium, high and critical findings, and on advisories that have no
# severity rating yet (not assessed is not the same as harmless). Low findings
# are still reported (job log, Security tab) but don't fail the run.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  TRIVY_IMAGE: aquasec/trivy:0.76.2
  SEMGREP_IMAGE: semgrep/semgrep:1.185.0

jobs:
  # Known vulnerabilities in the PHP packages (composer.lock), from the
  # PHP security advisories database. Like OWASP Dependency-Check.
  composer-audit:
    name: Dependencies (composer audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Audit composer.lock
        run: composer audit --locked --no-interaction --ignore-severity=low

  # Vulnerable packages, committed secrets and misconfigurations (Trivy),
  # plus a CycloneDX SBOM of everything the site ships.
  trivy:
    name: Vulnerabilities, secrets and SBOM (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Scan (SARIF for code scanning)
        run: >
          docker run --rm -v "$PWD:/src" -w /src ${{ env.TRIVY_IMAGE }}
          fs --quiet --scanners vuln,secret,misconfig
          --skip-dirs vendor --skip-dirs storage
          --format sarif --output trivy.sarif .

      - name: Upload to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: SBOM (CycloneDX)
        run: >
          docker run --rm -v "$PWD:/src" -w /src ${{ env.TRIVY_IMAGE }}
          fs --quiet --format cyclonedx --output sbom.cdx.json .

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

      - name: Fail on medium, high, critical or unrated findings
        run: >
          docker run --rm -v "$PWD:/src" -w /src ${{ env.TRIVY_IMAGE }}
          fs --quiet --scanners vuln,secret,misconfig
          --skip-dirs vendor --skip-dirs storage
          --severity UNKNOWN,MEDIUM,HIGH,CRITICAL --exit-code 1 .

  # Insecure patterns in our own code: SQL injection, XSS, unsafe file or
  # shell use, weak crypto, hard-coded secrets. Like SpotBugs/Find Security Bugs.
  semgrep:
    name: Code (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Scan
        run: >
          docker run --rm -e SEMGREP_SEND_METRICS=off -v "$PWD:/src" -w /src ${{ env.SEMGREP_IMAGE }}
          semgrep scan --metrics off
          --config p/php --config p/phpcs-security-audit --config p/secrets
          --exclude vendor --exclude storage
          --sarif --output semgrep.sarif --error

      - name: Upload to code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
